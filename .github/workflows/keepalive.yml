# Keeps the free Render service awake during the day (about 7am-9pm Pacific) by loading the home page,
# which does not touch the database, so Neon can still sleep. Outside these hours the site sleeps normally.
name: keepalive
on:
  schedule:
    - cron: '*/10 14-23 * * *' # 7am-4pm PDT (6am-3pm PST)
    - cron: '*/10 0-4 * * *' # 5pm-9pm PDT (4pm-8pm PST)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 -o /dev/null https://blockscape.onrender.com/
